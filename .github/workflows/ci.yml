name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invai-backend
    # Matches invai-infra/local/docker-compose.yml: Postgres with pgvector, Valkey. The
    # invai_app role + extensions are created by the step below (mirrors
    # invai-infra/local/init.sql, which this job doesn't have checked out).
    services:
      postgres:
        image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f # pg17
        env:
          POSTGRES_USER: invai
          POSTGRES_PASSWORD: invai
          POSTGRES_DB: invai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invai -d invai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2 # 8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Owner role: migrations, seed, outbox relay, cross-tenant jobs. RLS-enforced app role
      # below (invai_app has no BYPASSRLS, matching local dev and prod).
      MIGRATION_DATABASE_URL: postgres://invai:invai@localhost:5432/invai
      DATABASE_URL: postgres://invai_app:invai@localhost:5432/invai
      REDIS_URL: redis://localhost:6379
      S3_BUCKET: invai-ci
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: invai
      S3_SECRET_ACCESS_KEY: invai-secret
      S3_FORCE_PATH_STYLE: "true"
      IMAGING_URL: http://localhost:8000
      BETTER_AUTH_SECRET: ci-only-secret-32-chars-minimum-xxxx
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:5173
      # <keyId>:<base64 32 bytes> — a fixed CI-only dummy key, never a real secret.
      FIELD_ENCRYPTION_KEY: ci:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: invai-backend
          persist-credentials: false
      # invai-contracts is a private sibling repo (bek-sam/invai-contracts, linked via
      # link:../invai-contracts), read with the existing read-only deploy key. All work happens
      # on main (CLAUDE.md: no feature branches, no PRs), so there is only ever one ref to check
      # out.
      - name: Check out invai-contracts (sibling, main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-contracts
          ref: main
          path: invai-contracts
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: invai-backend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: invai-backend/.nvmrc
          cache: pnpm
          cache-dependency-path: invai-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: invai-contracts
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Create invai_app role and extensions (mirrors invai-infra/local/init.sql)
        env:
          PGPASSWORD: invai
        run: |
          psql -h localhost -U invai -d invai -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE invai_app LOGIN PASSWORD 'invai';
          GRANT ALL ON DATABASE invai TO invai_app;
          GRANT USAGE ON SCHEMA public TO invai_app;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS citext;
          ALTER DEFAULT PRIVILEGES FOR ROLE invai IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO invai_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE invai IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO invai_app;
          SQL
      # MinIO checks presigned signatures, which the upload tests rely on. Chainguard's public image:
      # Docker Hub's minio/minio is gone, quay.io refuses shared runners, dl.min.io returns 410.
      - name: Start MinIO (S3 for presign, upload and retention tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=invai -e MINIO_ROOT_PASSWORD=invai-secret \
            cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9 server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not start" && docker logs minio && exit 1
      - run: pnpm run --if-present db:migrate
      - run: pnpm run --if-present test
      # No ANTHROPIC_API_KEY here, so env.mocks.ai is true and this runs against the mock provider
      # (plumbing check only — see evals/run.ts and invai-docs/decisions/0007-ai-model-policy.md).
      - run: pnpm run --if-present evals

  # Supply-chain scan (T-31-4): same tools, digests and threshold as `pnpm scan` in invai-infra
  # (scan/tools.env). Results stay in the job log: nothing is uploaded. Ignores come from
  # .github/trivyignore.yaml, generated from invai-infra/scan/ignores.json; each has an expiry.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: invai-backend
          fetch-depth: 0
          persist-credentials: false
      - name: Check out invai-contracts (sibling, main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-contracts
          ref: main
          path: invai-contracts
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Secrets (gitleaks, full history)
        run: docker run --rm -v "$PWD/invai-backend:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner --exit-code 1
      - name: Dependencies (trivy, HIGH and CRITICAL with a fix)
        run: |
          docker run --rm -v "$PWD/invai-backend:/src:ro" aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa fs /src \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --include-dev-deps \
            --ignorefile /src/.github/trivyignore.yaml --exit-code 1
      - name: Workflows (actionlint, SHA pins, permissions)
        run: |
          docker run --rm -v "$PWD/invai-backend:/repo:ro" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
          unpinned="$(grep -rnE '^\s*(-\s+)?uses:' invai-backend/.github/workflows | grep -vE 'uses:\s+\./' | grep -vE '@[0-9a-f]{40}' || true)"
          [ -z "$unpinned" ] || { echo "actions not pinned by SHA:"; echo "$unpinned"; exit 1; }
          missing="$(grep -L '^permissions:' invai-backend/.github/workflows/*.yml || true)"
          [ -z "$missing" ] || { echo "no top-level permissions: $missing"; exit 1; }
      - name: Image (build, then trivy for vulnerabilities and secrets)
        run: |
          docker build -f invai-backend/Dockerfile -t scan-backend:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/invai-backend/.github/trivyignore.yaml:/ignore.yaml:ro" aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image scan-backend:ci \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /ignore.yaml --exit-code 1
